<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nusacoin Web Wallet - Secure, non-custodial cryptocurrency wallet" />
    <meta name="theme-color" content="#021702" />
    <script>
      // Apply the stored theme before the first paint, so the page
      // never flashes the wrong theme. Mirrors lib/theme.ts (same
      // storage key and dark default); the app takes over from here.
      try {
        if (localStorage.getItem('nux_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8f7');
        }
      } catch (e) { /* storage unavailable; dark default stands */ }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NUX Wallet" />
    <title>Nusacoin Wallet</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
