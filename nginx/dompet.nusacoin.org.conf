# Nginx server block for dompet.nusacoin.org
# Static frontend only. No application server, no Vite process at runtime.
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Then run: certbot --nginx -d dompet.nusacoin.org
# The built frontend (frontend/dist) must be copied to the root below
# before reloading nginx. See README.md, Deployment section.

server {
    listen 80;
    server_name dompet.nusacoin.org;

    # Redirect HTTP to HTTPS (certbot will modify this)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dompet.nusacoin.org;

    # SSL certificates (managed by certbot)
    # ssl_certificate /etc/letsencrypt/live/dompet.nusacoin.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dompet.nusacoin.org/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend (static files from the production build)
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html (it references hashed assets)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Electrs (Esplora-compatible) REST API, proxied same-origin so the
    # browser never talks to the upstream host directly and no CORS
    # configuration is needed. The frontend calls /electrs/...
    location /electrs/ {
        proxy_pass https://apinux.taobot.org/;
        proxy_set_header Host apinux.taobot.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Block direct access to health endpoint from outside
    location = /health {
        deny all;
    }
}
